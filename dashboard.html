<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYHlqxdxPS7wYWvFNvWh4qqbZcYmQ0h6s",
            authDomain: "find-your-trip-fcd69.firebaseapp.com",
            projectId: "find-your-trip-fcd69",
            storageBucket: "find-your-trip-fcd69.firebasestorage.app",
            messagingSenderId: "134544912671",
            appId: "1:134544912671:web:0e0864db863233ad9e802a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const tokenResult = await user.getIdTokenResult();
                    const role = tokenResult.claims.role || (user.email && (user.email.endsWith('@luxury.com') || user.email.toLowerCase().includes('admin')) ? 'admin' : 'user');
                    window.location.href = role === 'admin' ? 'admin_dashboard.html' : 'user_dashboard.html';
                } catch (e) {
                    const role = user.email && (user.email.endsWith('@luxury.com') || user.email.toLowerCase().includes('admin')) ? 'admin' : 'user';
                    window.location.href = role === 'admin' ? 'admin_dashboard.html' : 'user_dashboard.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</head>
<body>
    <p>Redirecting to your workspace...</p>
</body>
</html>
