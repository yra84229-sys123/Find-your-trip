    <!-- Registration Section -->
    <section id="register" class="hero-section" style="padding-top: 150px; min-height: 100vh; position: relative;">
        <!-- Standard Background -->
        <div class="hero-bg"></div>
        <div class="hero-overlay" style="background: rgba(0, 0, 0, 0.6);"></div>
        
        <!-- Colorful Blurry Blobs -->
        <div style="position: absolute; top: 15%; left: 30%; width: 300px; height: 300px; background: #0088ff; border-radius: 50%; filter: blur(80px); z-index: 1; opacity: 0.85;"></div>
        <div style="position: absolute; bottom: 10%; right: 28%; width: 350px; height: 350px; background: #ff5500; border-radius: 50%; filter: blur(90px); z-index: 1; opacity: 0.85;"></div>

        <div class="container" style="max-width: 480px; z-index: 10; position: relative;">
            <div class="glass-panel" style="padding: 50px 40px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
                
                <h2 style="font-family: var(--font-heading); color: white; font-weight: 700; font-size: 2.2rem; margin-bottom: 40px; letter-spacing: 0.5px;">Create Account</h2>
                
                <form id="register-form">
                    <div class="form-group" style="text-align: left; margin-bottom: 25px;">
                        <label style="color: white; font-weight: 600; display: block; margin-bottom: 8px; font-size: 1.05rem;">Username</label>
                        <input type="email" id="email" required placeholder="Email Address" style="width: 100%; padding: 16px 20px; border-radius: 8px; border: none; background-color: rgba(255, 255, 255, 0.15); color: white; font-family: var(--font-body); font-size: 1rem; outline: none; transition: background-color 0.3s;" onfocus="this.style.backgroundColor='rgba(255, 255, 255, 0.25)';" onblur="this.style.backgroundColor='rgba(255, 255, 255, 0.15)';" />
                    </div>
                    
                    <div class="form-group" style="text-align: left; margin-bottom: 35px;">
                        <label style="color: white; font-weight: 600; display: block; margin-bottom: 8px; font-size: 1.05rem;">Password</label>
                        <input type="password" id="password" required placeholder="Password" style="width: 100%; padding: 16px 20px; border-radius: 8px; border: none; background-color: rgba(255, 255, 255, 0.15); color: white; font-family: var(--font-body); font-size: 1rem; outline: none; transition: background-color 0.3s;" onfocus="this.style.backgroundColor='rgba(255, 255, 255, 0.25)';" onblur="this.style.backgroundColor='rgba(255, 255, 255, 0.15)';" />
                    </div>

                    <button type="submit" id="submit-btn" style="width: 100%; padding: 16px; border-radius: 8px; font-size: 1.1rem; font-weight: 700; border: none; cursor: pointer; background: white; color: #1e293b; margin-bottom: 25px; transition: transform 0.2s, background 0.2s;" onmouseover="this.style.backgroundColor='#f8fafc'" onmouseout="this.style.backgroundColor='white'">
                        Create Account
                    </button>
                    
                    <div style="margin-bottom: 30px;">
                        <button type="button" id="google-auth-btn" style="width: 100%; padding: 14px; border-radius: 8px; border: none; background: rgba(255, 255, 255, 0.15); color: white; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.3s; font-size: 0.95rem;" onmouseover="this.style.backgroundColor='rgba(255,255,255,0.25)'" onmouseout="this.style.backgroundColor='rgba(255,255,255,0.15)'">
                            <i class="fa-brands fa-google"></i> Continue with Google
                        </button>
                    </div>
                </form>
                
                <div style="font-size: 1rem; color: white; font-weight: 500;">
                    Have an account? <a href="login.html" style="color: white; text-decoration: underline; font-weight: 600;">Login Here</a>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="register.js"></script>
