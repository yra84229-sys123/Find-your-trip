<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Trip - Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark-main: #0c0d0e;
            --bg-dark-card: #131517;
            --bg-dark-hover: #1c1f22;
            --text-dark-main: #f3f4f6;
            --text-dark-muted: #8a8d90;

            --color-teal: #14b8a6;
            --color-purple: #8b5cf6;
            --color-blue: #3b82f6;
            --color-orange: #f97316;

            --font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-dark-main);
            color: var(--text-dark-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            width: 100%;
        }

        #root {
            width: 100%;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: var(--bg-dark-card);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 15px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--color-orange);
            text-decoration: none;
            padding-left: 10px;
            margin-bottom: 10px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            list-style: none;
        }

        .sidebar-item-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            background: transparent;
            border: none;
            color: var(--text-dark-muted);
            font-size: 0.88rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .sidebar-item-btn:hover {
            background-color: var(--bg-dark-hover);
            color: #ffffff;
        }

        .sidebar-item-btn.active {
            background-color: var(--bg-dark-hover);
            color: var(--color-orange);
            font-weight: 600;
        }

        .sidebar-logout {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            text-decoration: none;
            margin-top: 10px;
        }

        .sidebar-logout:hover {
            background-color: rgba(239, 68, 68, 0.08);
        }

        /* Main Content Panel */
        .main-panel {
            margin-left: 260px;
            flex-grow: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark-main);
        }

        /* Top Header Navigation */
        .top-header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background-color: var(--bg-dark-main);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-dark-muted);
            font-size: 1.15rem;
            cursor: pointer;
            position: relative;
        }

        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 5px 14px;
            border-radius: 30px;
            background-color: var(--bg-dark-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-widget-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-blue), var(--color-purple));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .user-widget-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark-main);
        }

        /* Dashboard Wrapper Content */
        .dashboard-content {
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .section-subtitle {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Statistics Cards Grid */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .analytics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }
        }

        .analytic-card {
            border-radius: 16px;
            padding: 24px 20px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .card-teal {
            background: linear-gradient(135deg, #1d979b, #11686b);
        }

        .card-purple {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
        }

        .card-blue {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        .card-orange {
            background: linear-gradient(135deg, #ea580c, #c2410c);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-icon-container {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 800;
            margin-top: 10px;
            line-height: 1;
        }

        .card-label {
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0.85;
            margin-top: 5px;
        }

        .card-trend {
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.9;
        }

        /* Detail Tables Card */
        .detail-card {
            background-color: var(--bg-dark-card);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .detail-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .detail-card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Premium Table Design */
        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        .premium-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .premium-table th {
            padding: 14px 16px;
            color: var(--text-dark-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .premium-table td {
            padding: 16px 16px;
            color: var(--text-dark-main);
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            vertical-align: middle;
        }

        .premium-table tbody tr {
            transition: background-color 0.3s;
        }

        .premium-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .pill-pending {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .pill-confirmed {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .pill-cancelled {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .action-button-group {
            display: flex;
            gap: 6px;
        }

        .action-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-status-confirm {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .btn-status-confirm:hover {
            background-color: #10b981;
            color: white;
        }

        .btn-status-cancel {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .btn-status-cancel:hover {
            background-color: #ef4444;
            color: white;
        }

        .btn-action-delete {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-dark-muted);
        }

        .btn-action-delete:hover {
            background-color: #6b7280;
            color: white;
        }

        /* Message Cards */
        .support-message-card {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: var(--text-dark-muted);
        }

        .message-sender-name {
            font-weight: 600;
            color: #ffffff;
        }

        .message-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .message-body {
            font-size: 0.85rem;
            color: var(--text-dark-main);
            line-height: 1.5;
        }

        /* Form Controls */
        .form-group-custom {
            margin-bottom: 20px;
        }

        .form-group-custom label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dark-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group-custom input,
        .form-group-custom textarea,
        .form-group-custom select {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #ffffff;
            outline: none;
            transition: all 0.3s;
        }

        .form-group-custom input:focus,
        .form-group-custom textarea:focus,
        .form-group-custom select:focus {
            border-color: var(--color-orange);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .submit-btn-orange {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--color-orange), #ea580c);
            border: none;
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn-orange:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(249, 115, 22, 0.25);
        }

        .profile-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
    </style>

    <!-- React 18 & ReactDOM 18 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel Standalone for In-Browser JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        if (window.Babel && Babel.availablePlugins && Babel.availablePlugins['transform-react-jsx']) {
            Babel.registerPlugin('transform-react-jsx-classic', function (api, opts) {
                return Babel.availablePlugins['transform-react-jsx'](api, { runtime: 'classic' });
            });
        }
    </script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel" data-plugins="transform-react-jsx-classic">
        const { useState, useEffect } = React;

        function AdminDashboard() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('overview');

            const [bookings, setBookings] = useState([]);
            const [messages, setMessages] = useState([]);
            const [systemUsers, setSystemUsers] = useState([]);

            useEffect(() => {
                const handleAuth = (e) => {
                    const authUser = e.detail || window.firebaseUser;
                    setUser(authUser);
                    if (authUser) {
                        setLoading(false);
                    } else {
                        setLoading(false);
                    }
                };

                window.addEventListener('auth-state-changed', handleAuth);
                if (window.firebaseUser !== undefined) {
                    handleAuth({ detail: window.firebaseUser });
                }

                return () => window.removeEventListener('auth-state-changed', handleAuth);
            }, []);

            useEffect(() => {
                if (!user) return;

                const db = window.db;
                const { collection, query, onSnapshot } = window.firestore;

                let unsubscribeBookings = () => { };
                let unsubscribeMessages = () => { };
                let unsubscribeUsers = () => { };

                const fallbackBookings = [
                    { id: "mock-1", userName: "Sopheap Khorn", userEmail: "sopheap@gmail.com", service: "Angkor Wat Sunrise Guided Tour", date: "2026-08-15", status: "confirmed", timestamp: null },
                    { id: "mock-2", userName: "Minea Chan", userEmail: "minea@gmail.com", service: "Song Saa Private Island Luxury Stay", date: "2026-09-02", status: "pending", timestamp: null },
                    { id: "mock-3", userName: "Borey Seng", userEmail: "borey@gmail.com", service: "Phnom Penh Historical Walking Tour", date: "2026-08-20", status: "cancelled", timestamp: null },
                    { id: "mock-4", userName: "Dara Ouk", userEmail: "dara.ouk@luxury.com", service: "Kep Sailing Club Dining & Sunset", date: "2026-08-25", status: "confirmed", timestamp: null }
                ];

                const fallbackMessages = [
                    { id: "mock-msg-1", senderName: "Sopheap Khorn", senderEmail: "sopheap@gmail.com", subject: "Airport pickup service request", text: "Hi, I have booked the Angkor Wat Sunrise Tour. Can you arrange an airport shuttle for us on arrival?", timestamp: new Date(Date.now() - 3600000) },
                    { id: "mock-msg-2", senderName: "Minea Chan", senderEmail: "minea@gmail.com", subject: "Special dietary request details", text: "Hello! We are staying at Song Saa Private Island next month. One of us is vegan. Could you please confirm if vegan meals are covered?", timestamp: new Date(Date.now() - 7200000) },
                    { id: "mock-msg-3", senderName: "Dara Ouk", senderEmail: "dara.ouk@luxury.com", subject: "Confirm booking status update", text: "Please confirm our table reservation at Kep Sailing Club. Thank you!", timestamp: new Date(Date.now() - 86400000) }
                ];

                const fallbackUsers = [
                    { id: "mock-u1", displayName: "Yu Ra", email: "yra84229@gmail.com", role: "USER", status: "Active" },
                    { id: "mock-u2", displayName: "Sopheap Khorn", email: "sopheap@gmail.com", role: "USER", status: "Active" },
                    { id: "mock-u3", displayName: "Minea Chan", email: "minea@gmail.com", role: "USER", status: "Unverified" }
                ];

                const bookingsQuery = query(collection(db, "bookings"));
                unsubscribeBookings = onSnapshot(bookingsQuery, (snapshot) => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    setBookings(items);
                }, (error) => {
                    console.warn(error);
                    setBookings(fallbackBookings);
                });

                const messagesQuery = query(collection(db, "messages"));
                unsubscribeMessages = onSnapshot(messagesQuery, (snapshot) => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    setMessages(items);
                }, (error) => {
                    console.warn(error);
                    setMessages(fallbackMessages);
                });

                const usersQuery = query(collection(db, "users"));
                unsubscribeUsers = onSnapshot(usersQuery, (snapshot) => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setSystemUsers(items);
                }, (error) => {
                    console.warn("Firestore users fetch error, using fallbacks:", error);
                    setSystemUsers(fallbackUsers);
                });

                return () => {
                    unsubscribeBookings();
                    unsubscribeMessages();
                    unsubscribeUsers();
                };
            }, [user]);

            const handleUpdateBookingStatus = async (bookingId, newStatus) => {
                const db = window.db;
                const { doc, updateDoc } = window.firestore;
                try {
                    await updateDoc(doc(db, "bookings", bookingId), {
                        status: newStatus
                    });
                } catch (error) {
                    console.error(error);
                }
            };

            const handleDeleteBooking = async (bookingId) => {
                if (!confirm("Delete booking record?")) return;
                const db = window.db;
                const { doc, deleteDoc } = window.firestore;
                try {
                    await deleteDoc(doc(db, "bookings", bookingId));
                } catch (error) {
                    console.error(error);
                }
            };

            const handleDeleteMessage = async (msgId) => {
                if (!confirm("Delete message?")) return;
                const db = window.db;
                const { doc, deleteDoc } = window.firestore;
                try {
                    await deleteDoc(doc(db, "messages", msgId));
                } catch (error) {
                    console.error(error);
                }
            };

            const handleLogoutClick = () => {
                const auth = window.firebaseAuth || (window.db ? getAuth() : null);
                const logoutAction = () => {
                    if (auth) {
                        signOut(auth).then(() => {
                            window.location.href = "login.html";
                        });
                    } else {
                        window.location.href = "login.html";
                    }
                };

                if (window.showSmoothTransition) {
                    window.showSmoothTransition("Logging you out safely...", logoutAction);
                } else {
                    logoutAction();
                }
            };

            const formatDate = (timestamp) => {
                if (!timestamp) return "Just now";
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            };

            if (loading) {
                return (
                    <div style={{ width: '100vw', height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: 'var(--bg-dark-main)' }}>
                        <div style={{ textAlign: 'center' }}>
                            <i className="fa-solid fa-circle-notch fa-spin" style={{ fontSize: '3rem', color: 'var(--color-orange)', marginBottom: '20px' }}></i>
                            <h2 style={{ color: '#ffffff' }}>Loading System...</h2>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div style={{ width: '100vw', height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: 'var(--bg-dark-main)', padding: '20px' }}>
                        <div style={{ backgroundColor: 'var(--bg-dark-card)', maxWidth: '450px', width: '100%', padding: '40px', textAlign: 'center', borderRadius: '24px', border: '1px solid rgba(255,255,255,0.05)' }}>
                            <i className="fa-solid fa-lock" style={{ fontSize: '4.5rem', color: 'var(--color-orange)', marginBottom: '25px' }}></i>
                            <h2 style={{ color: '#ffffff', marginBottom: '15px' }}>Security Verification Required</h2>
                            <p style={{ color: 'var(--text-dark-muted)', marginBottom: '30px', fontSize: '0.95rem' }}>Please authenticate to access the tour operations panel.</p>
                            <a href="login.html" className="submit-btn-orange" style={{ textDecoration: 'none', display: 'block' }}>Log In</a>
                        </div>
                    </div>
                );
            }

            const totalBookings = bookings.length;
            const pendingBookings = bookings.filter(b => b.status === 'pending').length;
            const confirmedBookings = bookings.filter(b => b.status === 'confirmed').length;
            const totalMsgs = messages.length;

            return (
                <div style={{ display: 'flex', width: '100%' }}>
                    {/* Left Sidebar */}
                    <div className="sidebar">
                        <div className="sidebar-top">
                            <a href="index.html" className="sidebar-brand">
                                <i className="fa-solid fa-plane-departure"></i>
                                <span>TOURLY</span>
                            </a>

                            <ul className="sidebar-menu">
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'overview' ? 'active' : ''}`} onClick={() => setActiveTab('overview')}>
                                        <i className="fa-solid fa-chart-line"></i> Dashboard Overview
                                    </button>
                                </li>
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'users' ? 'active' : ''}`} onClick={() => setActiveTab('users')}>
                                        <i className="fa-solid fa-users"></i> Manage Users
                                    </button>
                                </li>
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'bookings' ? 'active' : ''}`} onClick={() => setActiveTab('bookings')}>
                                        <i className="fa-solid fa-calendar-days"></i> Manage Bookings
                                    </button>
                                </li>
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'messages' ? 'active' : ''}`} onClick={() => setActiveTab('messages')}>
                                        <i className="fa-solid fa-envelope-open-text"></i> Manage Messages
                                    </button>
                                </li>
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'destinations' ? 'active' : ''}`} onClick={() => setActiveTab('destinations')}>
                                        <i className="fa-solid fa-map-location-dot"></i> Manage Destinations
                                    </button>
                                </li>
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'booking-stats' ? 'active' : ''}`} onClick={() => setActiveTab('booking-stats')}>

                                    </button>
                                </li>
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'reports' ? 'active' : ''}`} onClick={() => setActiveTab('reports')}>

                                    </button>
                                </li>
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>
                                        <i className="fa-solid fa-gear"></i> Settings
                                    </button>
                                </li>
                                <li>
                                    <button className={`sidebar-item-btn ${activeTab === 'admin-settings' ? 'active' : ''}`} onClick={() => setActiveTab('admin-settings')}>

                                <li>
                                    <button

                                    >
                                        <i className="fa-solid fa-arrow-left"></i> Back to Home
                                    </button>
                                </li>
                            </ul>
                        </div>

                        <button onClick={handleLogoutClick} className="sidebar-logout">

                    {/* Main Content Area */}

                                <button className="header-icon-btn"><i className="fa-regular fa-message"></i></button>

                                    <div className="user-widget-avatar">

                                    </div>
                                    <div className="user-widget-name">
                                        {user.displayName || user.email.split('@')[0]}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Content Area */}
                        <div className="dashboard-content">
                            <div>
                                <h4 className="section-subtitle">Overview</h4>

                            </div>

                            {/* Stats Grid */}
                            {activeTab === 'overview' && (
                                <React.Fragment>
                                    <div className="analytics-grid">
                                        <div className="analytic-card card-teal">
                                            <div className="card-top">
                                                <span style={{ fontWeight: 600, fontSize: '0.95rem' }}>Active Queries</span>
                                                <div className="card-icon-container"><i className="fa-solid fa-globe"></i></div>
                                            </div>
                                            <div>
                                                <div className="card-value">{totalBookings}</div>
                                                <div className="card-label">Total Bookings Executed</div>
                                            </div>
                                            <div className="card-trend"><i className="fa-solid fa-arrow-trend-up"></i> +12% this month</div>
                                        </div>
                                        <div className="analytic-card card-purple">
                                            <div className="card-top">
                                                <span style={{ fontWeight: 600, fontSize: '0.95rem' }}>Pending Action</span>
                                                <div className="card-icon-container"><i className="fa-solid fa-clock"></i></div>
                                            </div>
                                            <div>
                                                <div className="card-value">{pendingBookings}</div>
                                                <div className="card-label">Awaiting Confirmation</div>
                                            </div>
                                            <div className="card-trend"><i className="fa-solid fa-arrow-trend-down"></i> -3% from last week</div>
                                        </div>
                                        <div className="analytic-card card-blue">
                                            <div className="card-top">
                                                <span style={{ fontWeight: 600, fontSize: '0.95rem' }}>Confirmed Trips</span>
                                                <div className="card-icon-container"><i className="fa-solid fa-heart"></i></div>
                                            </div>
                                            <div>
                                                <div className="card-value">{confirmedBookings}</div>
                                                <div className="card-label">Active Trip Reservations</div>
                                            </div>
                                            <div className="card-trend"><i className="fa-solid fa-arrow-trend-up"></i> +30% growth</div>
                                        </div>
                                        <div className="analytic-card card-orange">
                                            <div className="card-top">
                                                <span style={{ fontWeight: 600, fontSize: '0.95rem' }}>Messages Sent</span>
                                                <div className="card-icon-container"><i className="fa-solid fa-envelope"></i></div>
                                            </div>
                                            <div>
                                                <div className="card-value">{totalMsgs}</div>
                                                <div className="card-label">Client Support Tickets</div>
                                            </div>
                                            <div className="card-trend"><i className="fa-solid fa-arrow-trend-up"></i> +18% engagement</div>
                                        </div>
                                    </div>

                                    <div className="detail-card" style={{ marginTop: '20px' }}>
                                        <div className="detail-card-header">
                                            <div className="detail-card-title">
                                                <i className="fa-solid fa-chart-bar" style={{ color: 'var(--color-orange)' }}></i>
                                                <span>Recent System Actions</span>
                                            </div>
                                        </div>
                                        <p style={{ color: 'var(--text-dark-muted)', fontSize: '0.9rem' }}>Use the left sidebar menus to see detailed user listings, messaging history, and stats.</p>
                                    </div>
                                </React.Fragment>
                            )}

                            {/* MANAGE USERS */}
                            {activeTab === 'users' && (
                                <div className="detail-card">
                                    <div className="detail-card-header">
                                        <div className="detail-card-title">
                                            <i className="fa-solid fa-users" style={{ color: 'var(--color-orange)' }}></i>
                                            <span>Manage System Users</span>
                                        </div>
                                    </div>
                                    <div className="table-responsive">
                                        <table className="premium-table">
                                            <thead>
                                                <tr>
                                                    <th>User Account</th>
                                                    <th>Contact Email</th>
                                                    <th>Account Role</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {systemUsers.map(u => (
                                                    <tr key={u.id}>
                                                        <td><strong>{u.displayName || u.email.split('@')[0]}</strong></td>
                                                        <td>{u.email}</td>
                                                        <td><span style={{ color: u.role === 'admin' ? 'var(--color-orange)' : 'inherit', fontWeight: u.role === 'admin' ? 'bold' : 'normal' }}>{u.role ? u.role.toUpperCase() : 'USER'}</span></td>
                                                        <td>
                                                            <span className={`status-pill pill-${u.status === 'Active' ? 'confirmed' : 'pending'}`}>
                                                                {u.status || 'Active'}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* MANAGE BOOKINGS */}
                            {activeTab === 'bookings' && (
                                <div className="detail-card">
                                    <div className="detail-card-header">
                                        <div className="detail-card-title">
                                            <i className="fa-solid fa-calendar-check" style={{ color: 'var(--color-orange)' }}></i>
                                            <span>Operational Reservations</span>
                                        </div>
                                    </div>
                                    {bookings.length === 0 ? (
                                        <p style={{ color: 'var(--text-dark-muted)', textAlign: 'center', padding: '30px' }}>No reservation records found.</p>
                                    ) : (
                                        <div className="table-responsive">
                                            <table className="premium-table">
                                                <thead>
                                                    <tr>
                                                        <th>Client Details</th>
                                                        <th>Reservation Item</th>
                                                        <th>Date Requested</th>
                                                        <th>Status</th>
                                                        <th>Action Controls</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {bookings.map(b => (
                                                        <tr key={b.id}>
                                                            <td>
                                                                <div style={{ fontWeight: '700' }}>{b.userName || 'Guest User'}</div>
                                                                <div style={{ fontSize: '0.8rem', color: 'var(--text-dark-muted)' }}>{b.userEmail}</div>
                                                            </td>
                                                            <td style={{ fontWeight: '700', color: '#ffffff' }}>{b.service}</td>
                                                            <td>{b.date}</td>
                                                            <td>
                                                                <span className={`status-pill pill-${b.status}`}>
                                                                    <i className={`fa-solid ${b.status === 'confirmed' ? 'fa-circle-check' : b.status === 'cancelled' ? 'fa-circle-xmark' : 'fa-circle-notch fa-spin'}`}></i>
                                                                    {b.status}
                                                                </span>
                                                            </td>
                                                            <td>
                                                                <div className="action-button-group">
                                                                    {b.status !== 'confirmed' && (
                                                                        <button title="Confirm Booking" onClick={() => handleUpdateBookingStatus(b.id, 'confirmed')} className="action-icon-btn btn-status-confirm">
                                                                            <i className="fa-solid fa-check"></i>
                                                                        </button>
                                                                    )}
                                                                    {b.status !== 'cancelled' && (
                                                                        <button title="Cancel Booking" onClick={() => handleUpdateBookingStatus(b.id, 'cancelled')} className="action-icon-btn btn-status-cancel">
                                                                            <i className="fa-solid fa-xmark"></i>
                                                                        </button>
                                                                    )}
                                                                    <button title="Delete Record" onClick={() => handleDeleteBooking(b.id)} className="action-icon-btn btn-action-delete">
                                                                        <i className="fa-solid fa-trash-can"></i>
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* MANAGE MESSAGES */}
                            {activeTab === 'messages' && (
                                <div className="detail-card">
                                    <div className="detail-card-header">
                                        <div className="detail-card-title">
                                            <i className="fa-solid fa-comments" style={{ color: 'var(--color-orange)' }}></i>
                                            <span>Inbound Communications</span>
                                        </div>
                                    </div>
                                    {messages.length === 0 ? (
                                        <p style={{ color: 'var(--text-dark-muted)', textAlign: 'center', padding: '30px' }}>No messages found.</p>
                                    ) : (
                                        <div>
                                            {messages.map(m => (
                                                <div key={m.id} className="support-message-card">
                                                    <div className="message-header">
                                                        <span className="message-sender-name">{m.senderName} ({m.senderEmail})</span>
                                                        <span>{formatDate(m.timestamp)}</span>
                                                    </div>
                                                    <div className="message-title">{m.subject}</div>
                                                    <div className="message-body">{m.text}</div>
                                                    <button
                                                        title="Delete Message"
                                                        onClick={() => handleDeleteMessage(m.id)}
                                                        className="action-icon-btn btn-action-delete"
                                                        style={{ position: 'absolute', bottom: '20px', right: '20px' }}
                                                    >
                                                        <i className="fa-solid fa-trash-can"></i>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* MANAGE DESTINATIONS */}
                            {activeTab === 'destinations' && (
                                <div className="detail-card">
                                    <div className="detail-card-header">
                                        <div className="detail-card-title">
                                            <i className="fa-solid fa-map-location-dot" style={{ color: 'var(--color-orange)' }}></i>
                                            <span>Manage Destination Packages</span>
                                        </div>
                                    </div>
                                    <div className="table-responsive">
                                        <table className="premium-table">
                                            <thead>
                                                <tr>
                                                    <th>Destination</th>
                                                    <th>Region</th>
                                                    <th>Active Tours</th>
                                                    <th>Base Rate</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td><strong>Angkor Wat Temple Tour</strong></td>
                                                    <td>Siem Reap</td>
                                                    <td>12 Guided Tours</td>
                                                    <td>$99 / day</td>
                                                </tr>
                                                <tr>
                                                    <td><strong>Kep Pepper Plantation Stay</strong></td>
                                                    <td>Kampot / Kep</td>
                                                    <td>5 Activities</td>
                                                    <td>$45 / day</td>
                                                </tr>
                                                <tr>
                                                    <td><strong>Song Saa Private Island Stay</strong></td>
                                                    <td>Sihanoukville</td>
                                                    <td>3 Packages Available</td>
                                                    <td>$350 / day</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* BOOKING STATISTICS */}
                            {activeTab === 'booking-stats' && (
                                <div className="detail-card">
                                    <div className="detail-card-header">
                                        <div className="detail-card-title">
                                            <i className="fa-solid fa-chart-simple" style={{ color: 'var(--color-orange)' }}></i>
                                            <span>Booking Performance Statistics</span>
                                        </div>
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '15px', color: 'var(--text-dark-main)' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                                            <span>Conversion Rate (Visits to Bookings)</span>
                                            <span style={{ fontWeight: 'bold', color: 'var(--color-teal)' }}>24.5%</span>
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                                            <span>Average Booking Order Value</span>
                                            <span style={{ fontWeight: 'bold', color: 'var(--color-teal)' }}>$220.00</span>
                                        </div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                                            <span>Cancellation Ratio</span>
                                            <span style={{ fontWeight: 'bold', color: '#ef4444' }}>8.2%</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* REPORTS & ANALYTICS */}
                            {activeTab === 'reports' && (
                                <div className="detail-card">
                                    <div className="detail-card-header">
                                        <div className="detail-card-title">
                                            <i className="fa-solid fa-file-invoice-dollar" style={{ color: 'var(--color-orange)' }}></i>
                                            <span>Monthly Revenue Reports & Downloads</span>
                                        </div>
                                    </div>
                                    <p style={{ color: 'var(--text-dark-muted)', marginBottom: '20px', fontSize: '0.9rem' }}>Generate invoices, compile travel reports, and download spreadsheets for tax records.</p>
                                    <div style={{ display: 'flex', gap: '10px' }}>
                                        <button className="submit-btn-orange" onClick={() => alert("Report downloaded successfully!")} style={{ flex: 1 }}>Download July 2026 Report</button>
                                        <button className="submit-btn-orange" onClick={() => alert("Invoice sheet prepared!")} style={{ flex: 1, background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', color: 'white' }}>Generate Invoices</button>
                                    </div>
                                </div>
                            )}

                            {/* SETTINGS */}
                            {activeTab === 'settings' && (
                                <div className="detail-card" style={{ maxWidth: '600px' }}>
                                    <div className="detail-card-header">
                                        <div className="detail-card-title">
                                            <i className="fa-solid fa-gear" style={{ color: 'var(--color-orange)' }}></i>
                                            <span>Workspace Preferences</span>
                                        </div>
                                    </div>
                                    <div className="profile-container">
                                        <div className="form-group-custom">
                                            <label>Default Currency Display</label>
                                            <select defaultValue="usd">
                                                <option value="usd">USD ($)</option>
                                                <option value="khr">KHR (៛)</option>
                                            </select>
                                        </div>
                                        <div className="form-group-custom">
                                            <label>Email Notification Frequency</label>
                                            <select defaultValue="instant">
                                                <option value="instant">Instant Alerts</option>
                                                <option value="daily">Daily Digest</option>
                                                <option value="none">Mute Notifications</option>
                                            </select>
                                        </div>
                                        <button className="submit-btn-orange" onClick={() => alert("Preferences saved successfully!")}>Save Preferences</button>
                                    </div>
                                </div>
                            )}

                            {/* ADMIN SETTINGS */}
                            {activeTab === 'admin-settings' && (
                                <div className="detail-card" style={{ maxWidth: '600px' }}>
                                    <div className="detail-card-header">
                                        <div className="detail-card-title">
                                            <i className="fa-solid fa-sliders" style={{ color: 'var(--color-orange)' }}></i>
                                            <span>Admin System Settings</span>
                                        </div>
                                    </div>
                                    <div className="profile-container">
                                        <div style={{ padding: '15px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                                            <strong>Database Backup</strong>
                                            <p style={{ fontSize: '0.8rem', color: 'var(--text-dark-muted)', marginTop: '4px' }}>Compile a snapshot backup of current Firestore database collections.</p>
                                            <button className="submit-btn-orange" onClick={() => alert("Backup compilation started in background...")} style={{ marginTop: '10px', width: 'auto', padding: '8px 16px' }}>Backup Now</button>
                                        </div>
                                        <div style={{ padding: '15px 0' }}>
                                            <strong>API Credentials Status</strong>
                                            <p style={{ fontSize: '0.8rem', color: 'var(--text-dark-muted)', marginTop: '4px' }}>Firebase Services are authenticated and operational.</p>
                                            <span className="status-pill pill-confirmed" style={{ marginTop: '10px' }}>Operational</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminDashboard />);
    </script>

    <script type="module" src="auth_state.js"></script>
</body>

</html>
