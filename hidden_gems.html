        const playBeep = (soundEnabled) => {
            if (!soundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // High pitch
                gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime); // Very quiet
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch (e) {

            // Theme state initialized from localStorage if present
            const [theme, setThemeState] = useState(localStorage.getItem('fyt-theme') || 'light');
            const [lang, setLang] = useState(localStorage.getItem('fyt-lang') || 'en');
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [notifyEmail, setNotifyEmail] = useState(true);
            const [notifyPromo, setNotifyPromo] = useState(true);

            // Drawer & View overlays
            const [activeProvince, setActiveProvince] = useState(null);
            const [activePlace, setActivePlace] = useState(null);

            // Calculator State
            const [calcOrigin, setCalcOrigin] = useState('takeo');
            const [calcDest, setCalcDest] = useState('siem-reap');
            const [calcVehicle, setCalcVehicle] = useState('sedan');
            const [calcResults, setCalcResults] = useState(null);
            const [isCalculating, setIsCalculating] = useState(false);

            // Hidden Gems state
            const [gemProvinceId, setGemProvinceId] = useState('takeo');
            const [gemActiveTab, setGemActiveTab] = useState('about');

            // Trip Planner State
            const [planBudget, setPlanBudget] = useState('');
            const [planDuration, setPlanDuration] = useState('');
            const [planInterest, setPlanInterest] = useState('');
            const [plannerResult, setPlannerResult] = useState(null);

            // Booking Form
            const [bookName, setBookName] = useState('');
            const [bookEmail, setBookEmail] = useState('');
            const [bookPackage, setBookPackage] = useState('');
            const [bookPayment, setBookPayment] = useState('credit');
            const [bookConfirm, setBookConfirm] = useState(false);

            // Scroll position tracking for transparent navbar
            const [scrolled, setScrolled] = useState(false);

            // Search field
            const [searchDest, setSearchDest] = useState('');
            const [searchBudget, setSearchBudget] = useState('');

            // Localized Translation Shortcut
            const t = (key) => translations[lang][key] || key;

            useEffect(() => {
                // Apply theme class to body
                document.body.className = `${theme}-theme`;
                localStorage.setItem('fyt-theme', theme);
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('fyt-lang', lang);
            }, [lang]);

            useEffect(() => {
                const handleScroll = () => {
                    if (window.scrollY > 50) {
                        setScrolled(true);
                    } else {
                        setScrolled(false);
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Theme click handler
            const handleThemeChange = (newTheme) => {
                setThemeState(newTheme);
                playBeep(soundEnabled);
            };

            // Switch toggle handler
            const handleToggle = (setter, value) => {
                setter(!value);
                playBeep(soundEnabled);
            };

            // Prefill booking from card
            const prefillBooking = (pkgName) => {
                setBookPackage(pkgName);
                playBeep(soundEnabled);
                document.getElementById('booking').scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            // Calculate Distance, Travel Time, Fuel
            const handleCalculation = (e) => {
                e.preventDefault();
                setIsCalculating(true);
                playBeep(soundEnabled);

                setTimeout(() => {
                    const origin = calcOrigin;
                    const dest = calcDest;
                    let distance = typeof getDistance === 'function' ? getDistance(origin, dest) : 180;

                    const v = vehicles[calcVehicle];
                    const speed = v.speed;
                    const economy = v.consumption;
                    const fuelType = v.fuelType;
                    const unitPrice = fuelPrices[fuelType];

                    // Time Calculation
                    const timeInHours = distance / speed;
                    const hours = Math.floor(timeInHours);
                    const minutes = Math.round((timeInHours - hours) * 60);

                    // Fuel Calculation
                    const totalFuel = (distance * economy) / 100;
                    const totalCost = totalFuel * unitPrice;

                    setCalcResults({
                        distance: distance.toFixed(0),
                        time: { hours, minutes },
                        fuel: totalFuel.toFixed(1),
                        cost: totalCost.toFixed(2),
                        economy: economy.toFixed(1),
                        fuelUnit: fuelType === 'electricity' ? 'kWh' : 'L'
                    });
                    setIsCalculating(false);
                }, 600);
            };

            // Trip Planner suggestion
            const handleTripPlanning = (e) => {
                e.preventDefault();
                playBeep(soundEnabled);

                const budget = parseInt(planBudget);
                const duration = parseInt(planDuration);
                const interest = planInterest;

                let suggestion = "";
                let suggestedProvinces = [];

                if (interest === "temples") {
                    suggestedProvinces = ['siem-reap', 'takeo'];
                    suggestion = lang === 'en'
                        ? `We highly suggest a ${duration}-day historical tour focusing on Siem Reap (Angkor Wat) and Takeo (Phnom Da). With your budget of $${budget}, you can comfortably enjoy private guided walks, local boutique hotels, and explore ancient Funan and Angkorian monuments.`
                        : `យើងខ្ញុំសូមណែនាំដំណើរកម្សាន្តប្រវត្តិសាស្ត្ររយៈពេល ${duration} ថ្ងៃ ដោយផ្តោតលើខេត្តសៀមរាប (អង្គរវត្ត) និងខេត្តតាកែវ (ភ្នំដា)។ ជាមួយនឹងកញ្ចប់ថវិកា $${budget} របស់អ្នក អ្នកអាចរីករាយជាមួយមគ្គុទ្ទេសក៍ផ្ទាល់ខ្លួន សណ្ឋាគារលំដាប់ថវិកា និងរុករកប្រាសាទបុរាណសម័យនគរភ្នំ និងសម័យអង្គរយ៉ាងពេញចិត្ត។`;
                } else if (interest === "nature") {
                    suggestedProvinces = ['kampot', 'pursat'];
                    suggestion = lang === 'en'
                        ? `A ${duration}-day nature escape to Kampot (Bokor Mountain) and Pursat (Cardamom Mountains) is ideal. Your budget of $${budget} covers amazing eco-lodges, riverside kayaking, jungle hiking, and relaxing close to fresh waterfalls.`
                        : `ដំណើរសម្រាកកាយបែបធម្មជាតិរយៈពេល ${duration} ថ្ងៃទៅកាន់ខេត្តកំពត (ភ្នំបូកគោ) និងខេត្តពោធិ៍សាត់ (ជួរភ្នំក្រវាញ) គឺសាកសមបំផុត។ ថវិកា $${budget} របស់អ្នកនឹងគ្របដណ្តប់លើផ្ទះស្នាក់បែបអេកូឡូស៊ី ការជិះទូកកាយ៉ាក់តាមដងព្រែក ការដើរព្រៃ និងការសម្រាកក្បែរទឹកធ្លាក់ដ៏ត្រជាក់។`;
                } else if (interest === "food") {
                    suggestedProvinces = ['battambang', 'kampong-cham'];
                    suggestion = lang === 'en'
                        ? `A ${duration}-day culinary and agricultural journey through Battambang and Kampong Cham is perfect. Taste Cambodia's best organic rice, Battambang street foods, fruit farms, and traditional cooking classes well within your $${budget} budget.`
                        : `ដំណើរកម្សាន្តសិល្បៈម្ហូបអាហាររយៈពេល ${duration} ថ្ងៃកាត់ខេត្តបាត់ដំបង និងខេត្តកំពង់ចាមគឺពិតជាអស្ចារ្យ។ ភ្លក់រសជាតិបាយសរីរាង្គដ៏ឆ្ងាញ់ ម្ហូបអាហារតាមចិញ្ចើមផ្លូវ ចម្ការផ្លែឈើ និងចូលរួមវគ្គបង្រៀនធ្វើម្ហូបបែបប្រពៃណី ទាំងអស់នេះស្ថិតក្នុងកញ្ចប់ថវិកា $${budget} របស់អ្នក។`;
                } else {
                    suggestedProvinces = ['siem-reap', 'battambang', 'kampong-chhnang'];
                    suggestion = lang === 'en'
                        ? `Based on your ${duration}-day travel plan and $${budget} budget, a cultural tour visiting Siem Reap temples, Battambang colonial buildings, and Kampong Chhnang's pottery villages is highly recommended.`
                        : `ផ្អែកលើគម្រោងធ្វើដំណើរ ${duration} ថ្ងៃ និងថវិកា $${budget} របស់អ្នក យើងខ្ញុំសូមណែនាំដំណើរកម្សាន្តបែបវប្បធម៌ទស្សនាប្រាសាទនៅសៀមរាប អគារបេតិកភណ្ឌបារាំងនៅបាត់ដំបង និងភូមិស្មូនឆ្នាំងដីឥដ្ឋនៅកំពង់ឆ្នាំង។`;
                }

                setPlannerResult({
                    suggestion,
                    provinces: suggestedProvinces.map(id => provincesData.find(p => p.id === id)).filter(Boolean)
                });
            };

            // Booking Form Submission
            const handleBookingSubmit = (e) => {
                e.preventDefault();
                playBeep(soundEnabled);

                const successMsg = lang === 'en'
                    ? `Thank you, ${bookName}! Your booking request for the "${bookPackage}" has been received. We will contact you shortly at ${bookEmail} to complete the payment via ${bookPayment.toUpperCase()}.`
                    : `សូមអរគុណ ${bookName}! ការស្នើសុំកក់របស់អ្នកសម្រាប់កញ្ចប់ "${bookPackage}" ត្រូវបានទទួលជោគជ័យហើយ។ យើងខ្ញុំនឹងទាក់ទងទៅអ្នកវិញក្នុងពេលឆាប់ៗតាមរយៈ ${bookEmail} ដើម្បីបញ្ចប់ការទូទាត់ប្រាក់តាម ${bookPayment.toUpperCase()}។`;

                alert(successMsg);
                setBookName('');
                setBookEmail('');
                setBookPackage('');
                setBookConfirm(false);
            };

            // Search Filter
            const handleSearchSubmit = (e) => {
                e.preventDefault();
                playBeep(soundEnabled);
                if (!searchDest) {
                    alert(lang === 'en' ? "Please enter a destination name." : "សូមវាយបញ្ចូលឈ្មោះគោលដៅទេសចរណ៍។");
                    return;
                }
                // Go to destinations page
                window.location.href = 'destinations.html';
            };

            // Retrieve current gem details based on selected province
            const currentGemProvince = provincesData.find(p => p.id === gemProvinceId) || provincesData[0];
            // Highlight a specific place in the selected province as the "Hidden Gem"
            const currentHiddenGem = (typeof hiddenGemsData !== 'undefined' && hiddenGemsData[gemProvinceId]) || {
                name: "Add Your Hidden Gem",
                khmerName: "កន្លែងលាក់កំបាំង",
                desc: "This is a placeholder. You can add your unique hidden gem information for this province in the hidden_gem_data.js file.",
                history: "Add unique history for this province's hidden gem in hidden_gem_data.js.",
                img: "https://via.placeholder.com/600x400/0d6efd/ffffff?text=Your+Hidden+Gem",
                roadCondition: "Add road conditions here...",
                contactLocalGuide: "Add contact info here..."
            };

            // Render Tech Stack Card click
            const handleTechTagClick = (tagName) => {
                playBeep(soundEnabled);
                const toastMsg = lang === 'en'
                    ? `I love building apps using ${tagName}! It's an essential tool in my development toolbox.`
                    : `ខ្ញុំចូលចិត្តអភិវឌ្ឍកម្មវិធីដោយប្រើ ${tagName} ណាស់! វាជាឧបករណ៍ដ៏សំខាន់នៅក្នុងការងាររបស់ខ្ញុំ។`;
                alert(toastMsg);
            };

            return (
                <div>
                    {/* Navbar */}
                    <nav className={`navbar ${scrolled ? 'scrolled' : ''}`}>
                        <div className="nav-top">
                            <div className="nav-contact">
                                <div className="nav-contact-icon"><i className="fa-solid fa-phone"></i></div>
                                <div className="nav-contact-text">
                                    <span>For Further Inquires :</span>
                                    <strong>+855 017 573 688</strong>
                                </div>
                            </div>
                            <div className="nav-logo" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                                <i className="fa-solid fa-plane-departure"></i>
                                <span>TOURLY</span>
                            </div>
                            <div className="nav-search">
                                <i className="fa-solid fa-magnifying-glass"></i>
                            </div>
                        </div>
                        <div className="nav-bottom">
                            <div className="nav-social">
                                <a href="https://www.facebook.com/share/14hLmmP1Gvx/?mibextid=wwXIfr" target="_blank"><i className="fa-brands fa-facebook-f"></i></a>
                                <a href="https://www.instagram.com/iur.aaaa" target="_blank"><i className="fa-brands fa-instagram"></i></a>
                            </div>
                            <div className="nav-links">
                                <a href="index.html" className="nav-link">HOME</a>
                                <a href="destinations.html" className="nav-link">POPULAR DESTINATIONS</a>
                                <a href="packages.html" className="nav-link">PACKAGES <i className="fa-solid fa-chevron-down" style={{ fontSize: '0.7rem' }}></i></a>
                                <a href="trip_planner.html" className="nav-link">TRIP PLANNER</a>
                                <a href="calculator.html" className="nav-link">CALCULATOR</a>
                                <a href="#gems" className="nav-link active">HIDDEN GEMS</a>
                                <a href="settings.html" className="nav-link">SETTINGS <i className="fa-solid fa-chevron-down" style={{ fontSize: '0.7rem' }}></i></a>
                                <a href="about.html" className="nav-link">ABOUT US</a>
                            </div>
                            <a href="#booking" className="nav-book-btn">BOOK NOW</a>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header id="home" className="hero-section">
                        <div className="hero-bg"></div>
                        <div className="hero-overlay"></div>
                        <div className="container hero-content">
                            <h1 className="hero-title">
                               <span>  HIDDEN GEMS</span>
                            </h1>
                            <p className="hero-subtitle">Explore the secret places, historical stories, and off-the-beaten-path destinations across Cambodia.</p>

                            <div className="hero-buttons" style={{ display: 'flex', gap: '20px', justifyContent: 'center' }}>
                                <button className="btn-primary" style={{ borderRadius: '30px', background: '#0d6efd', padding: '15px 35px', fontWeight: 'bold' }} onClick={() => { playBeep(soundEnabled); document.getElementById('gems').scrollIntoView({ behavior: 'smooth' }); }}>DISCOVER</button>
                            </div>
                        </div>

                        {/* Features Info Bar */}
                        <div className="hero-info-bar">
                            <div className="info-item">
                                <div className="info-icon"><i className="fa-solid fa-shield-halved"></i></div>
                                <div className="info-text">
                                    <h4>Best Price Guarantee</h4>
                                    <p>We guarantee the best price for your trips.</p>
                                </div>
                            </div>
                            <div className="info-item">
                                <div className="info-icon"><i className="fa-solid fa-headset"></i></div>
                                <div className="info-text">
                                    <h4>24/7 Customer Support</h4>
                                    <p>We're here to help you anytime, anywhere.</p>
                                </div>
                            </div>
                            <div className="info-item">
                                <div className="info-icon"><i className="fa-solid fa-shield"></i></div>
                                <div className="info-text">
                                    <h4>Safe & Secure Booking</h4>
                                    <p>Your safety is our top priority.</p>
                                </div>
                            </div>
                            <div className="info-item">
                                <div className="info-icon"><i className="fa-solid fa-plane"></i></div>
                                <div className="info-text">
                                    <h4>Easy & Fast Booking</h4>
                                    <p>Book your trip in just a few clicks.</p>
                                </div>
                            </div>
                            <div className="info-item">
                                <div className="info-icon"><i className="fa-solid fa-thumbs-up"></i></div>
                                <div className="info-text">
                                    <h4>Trusted by Travelers</h4>
                                    <p>Join thousands of happy travelers worldwide.</p>
                                </div>
                            </div>
                        </div>
                    </header>



                    
                    {/* Hidden Gems Section */}
                    <section id="gems" className="section-padding bg-light">
                        <div className="container">
                            <div className="section-header text-center">
                                <span className="badge">Off The Beaten Path</span>
                                <h2>{t('gemTitle')}</h2>
                                <p>{t('gemSubtitle')}</p>
                            </div>

                            <div className="gems-filter-bar form-group">
                                <label style={{ justifyContent: 'center' }}><i className="fa-solid fa-compass"></i> {t('gemPrompt')}</label>
                                <select
                                    value={gemProvinceId}
                                    onChange={(e) => {
                                        playBeep(soundEnabled);
                                        setGemProvinceId(e.target.value);
                                        setGemActiveTab('about');
                                    }}
                                    className="glass-panel"
                                    style={{ borderWidth: '2px' }}
                                >
                                    {provincesData.map(p => (
                                        <option key={p.id} value={p.id}>{p.name} Province</option>
                                    ))}
                                </select>
                            </div>

                            <div className="gem-layout glass-panel" style={{ padding: '30px', background: 'var(--bg-panel)' }}>
                                <div className="gem-image-card">
                                    <img src={currentHiddenGem.img} alt={currentHiddenGem.name} className="gem-img" />
                                    <div className="gem-image-overlay">
                                        <div className="badge badge-light" style={{ alignSelf: 'flex-start', marginBottom: '10px' }}>Hidden Gem</div>
                                        <h3>{currentHiddenGem.name}</h3>
                                        <p>{currentGemProvince.name} Province</p>
                                    </div>
                                </div>

                                <div className="gem-info-card">
                                    <h3 className="gem-info-title">{currentHiddenGem.name}</h3>

                                    {/* Tabs */}
                                    <div className="gem-info-tabs">
                                        <button
                                            className={`gem-tab ${gemActiveTab === 'about' ? 'active' : ''}`}
                                            onClick={() => { playBeep(soundEnabled); setGemActiveTab('about'); }}
                                        >
                                            {t('gemTabAbout')}
                                        </button>
                                        <button
                                            className={`gem-tab ${gemActiveTab === 'history' ? 'active' : ''}`}
                                            onClick={() => { playBeep(soundEnabled); setGemActiveTab('history'); }}
                                        >
                                            {t('gemTabHistory')}
                                        </button>
                                        <button
                                            className={`gem-tab ${gemActiveTab === 'how-to' ? 'active' : ''}`}
                                            onClick={() => { playBeep(soundEnabled); setGemActiveTab('how-to'); }}
                                        >
                                            {t('gemTabHowTo')}
                                        </button>
                                    </div>

                                    {/* Tab Contents */}
                                    <div className="gem-tab-content">
                                        {gemActiveTab === 'about' && (
                                            <div>
                                                <p style={{ marginBottom: '15px' }}>{currentHiddenGem.desc}</p>
                                                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: '10px' }}>
                                                    <span className="tech-tag"><i className="fa-solid fa-star text-accent"></i> Authentic Khmer Heritage</span>
                                                    <span className="tech-tag"><i className="fa-solid fa-leaf text-accent"></i> Eco-friendly Spot</span>
                                                </div>
                                            </div>
                                        )}

                                        {gemActiveTab === 'history' && (
                                            <div>
                                                <p style={{ whiteSpace: 'pre-wrap', fontSize: '0.92rem', lineHeight: '1.5' }}>{currentHiddenGem.history}</p>
                                            </div>
                                        )}

                                        {gemActiveTab === 'how-to' && (
                                            <div>
                                                <p style={{ marginBottom: '10px' }}><b>Road condition:</b> {currentHiddenGem.roadCondition}</p>
                                                <p style={{ marginBottom: '10px' }}><b>Contact Local Guide:</b> {currentHiddenGem.contactLocalGuide}</p>
                                                <button
                                                    className="btn-secondary mt-2"
                                                    style={{ padding: '10px 20px', fontSize: '0.9rem' }}
                                                    onClick={() => {
                                                        setCalcOrigin('takeo');
                                                        setCalcDest(currentGemProvince.id);
                                                        document.getElementById('calculator').scrollIntoView({ behavior: 'smooth' });
                                                    }}
                                                >
                                                    Calculate Travel Route <i className="fa-solid fa-arrow-right"></i>
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                                        {/* Footer */}
                    <footer className="footer-modern bg-gradient-dark text-light" style={{ background: '#050a15', paddingTop: '60px', paddingBottom: '20px', borderTop: '1px solid rgba(255,255,255,0.05)' }}>
                        <div className="container">
                            <div className="row" style={{ display: 'flex', flexWrap: 'wrap', gap: '30px', marginBottom: '40px' }}>
                                {/* Brand Column */}
                                <div className="col-lg-4 col-md-6" style={{ flex: '1 1 300px' }}>
                                    <div className="footer-brand" style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '15px' }}>
                                        <i className="fa-solid fa-location-dot" style={{ fontSize: '2rem', color: 'var(--primary)' }}></i>
                                        <div>
                                            <h3 style={{ margin: 0, fontSize: '1.5rem', fontWeight: '800', letterSpacing: '1px' }}>FIND YOU TRIP</h3>
                                            <span style={{ fontSize: '0.8rem', color: '#94a3b8' }}>Discover. Explore. Enjoy.</span>
                                        </div>

                                    </p>
                                    <div className="footer-socials" style={{ display: 'flex', gap: '10px' }}>

                                        <a href="https://www.instagram.com/iur.aaaa" target="_blank" style={{ width: '36px', height: '36px', borderRadius: '50%', background: 'rgba(255,255,255,0.05)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', textDecoration: 'none', transition: '0.3s' }}><i className="fa-brands fa-instagram"></i></a>
                                    </div>
                                </div>

                                {/* Quick Links */}
                                <div className="col-lg-2 col-md-6" style={{ flex: '1 1 150px' }}>
                                    <h4 style={{ color: 'white', fontSize: '1.1rem', marginBottom: '20px', fontWeight: '600', position: 'relative' }}>Quick Links<span style={{ position: 'absolute', bottom: '-5px', left: 0, width: '30px', height: '2px', background: 'var(--primary)' }}></span></h4>
                                    <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: '12px' }}>
                                        <li><a href="index.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Home</a></li>
                                        <li><a href="destinations.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Destinations</a></li>
                                        <li><a href="packages.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Tour Packages</a></li>
                                        <li><a href="trip_planner.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Trip Planner</a></li>
                                        <li><a href="hidden_gems.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Hidden Gems</a></li>
                                        <li><a href="about.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> About Us</a></li>
                                    </ul>
                                </div>

                                {/* Popular Destinations */}
                                <div className="col-lg-2 col-md-6" style={{ flex: '1 1 150px' }}>
                                    <h4 style={{ color: 'white', fontSize: '1.1rem', marginBottom: '20px', fontWeight: '600', position: 'relative' }}>Popular Destinations<span style={{ position: 'absolute', bottom: '-5px', left: 0, width: '30px', height: '2px', background: 'var(--primary)' }}></span></h4>
                                    <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: '12px' }}>
                                        <li><a href="destinations.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Siem Reap</a></li>
                                        <li><a href="destinations.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Phnom Penh</a></li>
                                        <li><a href="destinations.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Kampot</a></li>
                                        <li><a href="destinations.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Battambang</a></li>
                                        <li><a href="destinations.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Koh Rong</a></li>
                                        <li><a href="destinations.html" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Kep</a></li>
                                    </ul>
                                </div>

                                {/* Support */}
                                <div className="col-lg-2 col-md-6" style={{ flex: '1 1 150px' }}>
                                    <h4 style={{ color: 'white', fontSize: '1.1rem', marginBottom: '20px', fontWeight: '600', position: 'relative' }}>Support<span style={{ position: 'absolute', bottom: '-5px', left: 0, width: '30px', height: '2px', background: 'var(--primary)' }}></span></h4>
                                    <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: '12px' }}>
                                        <li><a href="#" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> FAQ</a></li>
                                        <li><a href="#" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Terms & Conditions</a></li>
                                        <li><a href="#" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Privacy Policy</a></li>
                                        <li><a href="#" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Refund Policy</a></li>
                                        <li><a href="#" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Booking Guide</a></li>
                                        <li><a href="#" style={{ color: '#94a3b8', textDecoration: 'none', transition: '0.3s', display: 'flex', alignItems: 'center', gap: '8px' }}><i className="fa-solid fa-angle-right" style={{ color: 'var(--primary)', fontSize: '0.8rem' }}></i> Customer Support</a></li>
                                    </ul>
                                </div>

                                {/* Newsletter */}
                                <div className="col-lg-3 col-md-6" style={{ flex: '1 1 250px' }}>
                                    <h4 style={{ color: 'white', fontSize: '1.1rem', marginBottom: '20px', fontWeight: '600', position: 'relative' }}>Newsletter<span style={{ position: 'absolute', bottom: '-5px', left: 0, width: '30px', height: '2px', background: 'var(--primary)' }}></span></h4>
                                    <p style={{ color: '#94a3b8', fontSize: '0.9rem', marginBottom: '15px' }}>Subscribe to get special offers and travel inspiration.</p>
                                    <div style={{ position: 'relative', display: 'flex' }}>
                                        <input type="email" placeholder="Your email address" style={{ width: '100%', padding: '12px 45px 12px 15px', borderRadius: '30px', border: 'none', background: 'rgba(255,255,255,0.05)', color: 'white', outline: 'none' }} />
                                        <button style={{ position: 'absolute', right: '4px', top: '4px', bottom: '4px', width: '38px', borderRadius: '50%', background: 'var(--primary)', border: 'none', color: 'white', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                            <i className="fa-solid fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Bottom Bar */}
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '20px', marginTop: '20px' }}>
                                <p style={{ color: '#94a3b8', fontSize: '0.9rem', margin: 0 }}>&copy; 2024 <span style={{ color: 'var(--primary)' }}>Find You Trip</span>. All rights reserved.</p>
                                <div style={{ color: '#94a3b8', fontSize: '0.9rem', display: 'flex', alignItems: 'center', gap: '10px', fontStyle: 'italic' }}>
                                    <i className="fa-solid fa-plane"></i> - Let's find your next adventure.
                                </div>
                            </div>
                        </div>
                    </footer>

                    {/* Province Detail Slide-out Drawer */}
                    {activeProvince && (
                        <div className="drawer-overlay" onClick={() => { playBeep(soundEnabled); setActiveProvince(null); setActivePlace(null); }}>
                            <div className="drawer-content" onClick={(e) => e.stopPropagation()}>
                                <button className="drawer-close" onClick={() => { playBeep(soundEnabled); setActiveProvince(null); setActivePlace(null); }}>
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                {activePlace ? (
                                    /* Place details view */
                                    <div className="place-detail-view">
                                        <div className="place-detail-back" onClick={() => { playBeep(soundEnabled); setActivePlace(null); }}>
                                            <i className="fa-solid fa-arrow-left-long"></i> Back to {activeProvince.name}
                                        </div>
                                        <div className="drawer-header-img" style={{ backgroundImage: `url('${activePlace.img}')` }}>
                                            <div className="drawer-header-overlay">
                                                <span className="badge badge-light" style={{ alignSelf: 'flex-start', marginBottom: '10px' }}>{activeProvince.name}</span>
                                                <h2 className="drawer-province-title">{activePlace.name}</h2>
                                            </div>
                                        </div>

                                        <h4 className="drawer-section-title">History & Information</h4>
                                        <div className="place-history-text">{activePlace.history}</div>

                                        <button
                                            className="btn-primary w-100 mt-4"
                                            onClick={() => {
                                                playBeep(soundEnabled);
                                                setActiveProvince(null);
                                                setActivePlace(null);
                                                prefillBooking(`Trip to ${activePlace.name}`);
                                            }}
                                        >
                                            Book Trip to This Place
                                        </button>
                                    </div>
                                ) : (
                                    /* Province details view */
                                    <div>
                                        <div className="drawer-header-img" style={{ backgroundImage: `url('${activeProvince.detailImg}')` }}>
                                            <div className="drawer-header-overlay">
                                                <h2 className="drawer-province-title">{activeProvince.name}</h2>
                                            </div>
                                        </div>

                                        <p style={{ fontSize: '1.05rem', fontStyle: 'italic', color: 'var(--text-muted)', marginBottom: '20px' }}>
                                            "{activeProvince.tagline}"
                                        </p>

                                        <h4 className="drawer-section-title">Interactive Map</h4>
                                        <div style={{ borderRadius: '16px', overflow: 'hidden', border: '1px solid var(--border-color)', height: '220px', marginBottom: '30px' }}>
                                            <iframe
                                                width="100%"
                                                height="100%"
                                                style={{ border: 0 }}
                                                loading="lazy"
                                                allowFullScreen
                                                src={`https://maps.google.com/maps?q=${encodeURIComponent(activeProvince.name + ' Province Cambodia')}&t=&z=9&ie=UTF8&iwloc=&output=embed`}
                                            ></iframe>
                                        </div>

                                        <h4 className="drawer-section-title">Places of Interest</h4>
                                        <div className="drawer-places-list">
                                            {activeProvince.places.map((place, idx) => (
                                                <div
                                                    key={place.id}
                                                    className="drawer-place-card"
                                                    onClick={() => {
                                                        playBeep(soundEnabled);
                                                        setActivePlace(place);
                                                    }}
                                                >
                                                    <img src={place.img} alt={place.name} className="drawer-place-img" />
                                                    <div className="drawer-place-info">
                                                        <h5 className="drawer-place-name">{idx + 1}. {place.name}</h5>
                                                        <p className="drawer-place-desc">{place.desc}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
